# Virtual workspace root. Nothing installs from the root itself; it only ties the
# member distributions together and holds the shared Python tool configuration.
# Every glob below resolves only to directories that now carry a `pyproject.toml`.
# `apps/web` is a Next.js (pnpm) app with no `pyproject.toml` (03 creates it), so it
# is excluded here so `uv sync`/`uv lock` do not treat it as a Python member once it
# lands. `packs/` is data-only and is deliberately not a member.

# Intel macOS is a development host for this repository, and `onnxruntime` (pulled in
# by Recallatron's `local-embeddings` extra) stopped publishing macOS x86_64 wheels
# after 1.23.2. Without this line the universal lock takes the newest release, and
# `uv sync --frozen --extra local-embeddings` then refuses on that host for want of a
# wheel. Naming the environment makes the resolver keep a version that installs there;
# every other platform resolves as it would anyway.
[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.uv.workspace]
members = ["packages/*", "apps/*", "modules/*", "connectors", "runtimes", "channels"]
exclude = ["apps/web"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # `httpx` drives the FastAPI apps (tests/test_healthz.py); `httpx2` drives the
    # MCP transport, because `mcp`'s own client takes an `httpx2.AsyncClient` and
    # nothing else. Declared rather than leaned on as a transitive of `mcp`: a test
    # importing a package nothing declares breaks the day that package's own
    # dependencies drop it, and the break lands on whoever next runs `uv lock`.
    "httpx2>=2.13",
    "ruff>=0.16.7",
    "mypy>=1.11",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
# docs/notes/ holds verbatim copies of Bureau run records (planning artifacts committed at
# close-out). They are frozen records, byte-identical to the run directory, so the formatter
# must not reflow the Python fences inside them.
exclude = ["docs/notes/**"]

[tool.mypy]
strict = true
python_version = "3.12"
# The four Python `apps/*` directories are named explicitly rather than a bare
# `apps` glob: mypy has no default `node_modules` exclusion and does not read
# `.gitignore`, so a bare `apps` glob would recurse into `apps/web/node_modules`
# once 04's `pnpm install` runs. Naming the four Python dirs keeps `apps/web`
# (03 creates it) out of mypy's walk with no exclusion regex to maintain.
files = [
    "packages",
    "apps/core",
    "apps/worker",
    "apps/mcp",
    "apps/cli",
    "modules",
    "connectors",
    "runtimes",
    "channels",
]
# src layout: resolve each distribution by the name under its own `src/` directory
# rather than as a dotted path from the repo root. Every source-layout member's
# `src/` is a package base so cross-distribution imports (e.g. apps/core importing
# rheo_app_mcp) resolve to the top-level package name, not a dotted repo path.
mypy_path = [
    "packages/contracts/src",
    "packages/core/src",
    "apps/core/src",
    "apps/worker/src",
    "apps/mcp/src",
    "apps/cli/src",
    "modules/recallatron/src",
    "modules/relationships/src",
    "modules/leads/src",
    "modules/current/src",
    "connectors/src",
    "runtimes/src",
    "channels/src",
]
explicit_package_bases = true

[tool.pytest.ini_options]
# `modules` beside `tests` so each module distribution's own `contract_tests` suite
# is collected by `make test` and by CI, not only when somebody names its path.
testpaths = ["tests", "modules"]
asyncio_mode = "auto"
markers = ["postgres: needs the local Postgres"]
