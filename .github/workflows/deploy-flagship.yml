name: Deploy flagship

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-flagship
  cancel-in-progress: false

jobs:
  gate:
    name: Check deploy secrets
    runs-on: ubuntu-latest
    if: github.repository == 'rheos/rheostream'
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check the three deploy secrets are set
        id: check
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          if [ -n "$COOLIFY_TOKEN" ] && [ -n "$COOLIFY_BASE_URL" ] && [ -n "$COOLIFY_APP_UUID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::deploy-flagship skipped: COOLIFY_TOKEN, COOLIFY_BASE_URL and COOLIFY_APP_UUID are not all set"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Trigger Coolify deploy
    needs: gate
    runs-on: ubuntu-latest
    if: github.repository == 'rheos/rheostream' && needs.gate.outputs.ready == 'true'
    steps:
      - name: Call the Coolify deploy API
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          status="$(curl -s -o "$RUNNER_TEMP/deploy-response.json" -w '%{http_code}' \
            --connect-timeout 10 --max-time 60 -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_BASE_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID")" || curl_exit=$?
          if [ -n "${curl_exit:-}" ]; then
            echo "::error::deploy request failed (curl exit $curl_exit)"
            exit 1
          fi
          if [ "${status:0:1}" != "2" ]; then
            echo "::error::deploy request failed (status $status)"
            exit 1
          fi
