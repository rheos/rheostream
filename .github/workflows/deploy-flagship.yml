name: Deploy flagship

# A deploy starts only after CI has finished on the commit (issue #154). The
# `workflow_run` trigger fires when "Repository checks" completes for a push to
# main; the gate job then re-checks every push-event workflow on that SHA through
# the API, so a CI workflow added later is covered without editing this list.
# Manual dispatch runs the same gate against the dispatched main commit.
on:
  workflow_run:
    workflows: ["Repository checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-flagship
  cancel-in-progress: false

jobs:
  gate:
    name: Check CI and deploy secrets
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The repository has no `production` environment yet, so GitHub creates an
    # unprotected one on first use and the job keeps reading the repository-level
    # secrets. Scoping the secrets to the environment is a settings step.
    environment: production
    permissions:
      actions: read
      contents: read
    # A workflow_run must come from a successful CI run for a push to this
    # repository's main. `head_branch` alone is not enough: a fork PR from a branch
    # named main also reports head_branch 'main', but its event is pull_request.
    if: >-
      github.repository == 'rheos/rheostream' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository)
      )
    outputs:
      ready: ${{ steps.tip.outputs.ready }}
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - name: Check the three deploy secrets are set
        id: secrets
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          if [ -n "$COOLIFY_TOKEN" ] && [ -n "$COOLIFY_BASE_URL" ] && [ -n "$COOLIFY_APP_UUID" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::deploy-flagship skipped: COOLIFY_TOKEN, COOLIFY_BASE_URL and COOLIFY_APP_UUID are not all set"
            echo "set=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for every CI workflow on the commit to succeed
        id: ci
        if: steps.secrets.outputs.set == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_WAIT_SECONDS: "1800"
          CI_POLL_SECONDS: "20"
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            sha="$RUN_HEAD_SHA"
          else
            sha="$GITHUB_SHA"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Commit under test: $sha"

          # The latest run of each push-event workflow on this SHA, except this one.
          # A re-run keeps its run id, so max_by(.id) per workflow picks the newest.
          query='[.workflow_runs[]
                  | select(.path | startswith(".github/workflows/deploy-flagship.yml") | not)]
                 | group_by(.workflow_id) | map(max_by(.id))
                 | map({path, status, conclusion})'
          deadline=$(( $(date +%s) + CI_WAIT_SECONDS ))
          last_report=""
          while :; do
            if runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs" \
                -f head_sha="$sha" -f event=push -f per_page=100 --jq "$query")"; then
              failed="$(jq -r '.[] | select(.status == "completed"
                        and (.conclusion | IN("success", "skipped", "neutral") | not))
                        | "\(.path) (\(.conclusion))"' <<<"$runs")"
              if [ -n "$failed" ]; then
                echo "::error::CI did not succeed on $sha, not deploying:"
                echo "$failed"
                exit 1
              fi
              pending="$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")"
              has_checks="$(jq '[.[] | select(.path | startswith(".github/workflows/repository-checks.yml"))] | length' <<<"$runs")"
              if [ "$has_checks" -gt 0 ] && [ "$pending" -eq 0 ]; then
                echo "All CI workflows on $sha succeeded:"
                jq -r '.[] | "  \(.path): \(.conclusion)"' <<<"$runs"
                break
              fi
              report="pending=$pending repository-checks-present=$has_checks"
            else
              report="GitHub API call failed; retrying"
            fi
            if [ "$report" != "$last_report" ]; then
              echo "Waiting for CI: $report"
              last_report="$report"
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::CI on $sha did not finish within ${CI_WAIT_SECONDS}s ($report)"
              exit 1
            fi
            sleep "$CI_POLL_SECONDS"
          done

      # Coolify deploys the tip of main, not a given SHA. If main has moved on,
      # this commit is no longer what would ship; the newer commit's own CI run
      # triggers its own deploy, so this run steps aside instead.
      - name: Check the commit is still the tip of main
        id: tip
        if: steps.ci.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ci.outputs.sha }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$tip" = "$SHA" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::deploy skipped: main has moved from $SHA to $tip; the newer commit deploys once its CI passes"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Coolify and wait for it to finish
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    if: github.repository == 'rheos/rheostream' && needs.gate.outputs.ready == 'true'
    steps:
      # The repository is public, so this step never prints the base URL, the host,
      # the deployment id or any response body; it prints HTTP codes and the
      # deployment status only. `curl -s` without `-S` keeps curl's own error text
      # (which names the host) out of the log too.
      - name: Start the Coolify deploy and poll it to a final status
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          DEPLOY_WAIT_SECONDS: "1800"
          DEPLOY_POLL_SECONDS: "10"
        run: |
          set -euo pipefail
          host="${COOLIFY_BASE_URL#*://}"
          host="${host%%/*}"
          echo "::add-mask::$host"
          echo "::add-mask::${host%%:*}"
          base="${COOLIFY_BASE_URL%/}"
          resp="$RUNNER_TEMP/coolify-response.json"
          trap 'rm -f "$resp"' EXIT

          curl_exit=0
          code="$(curl -s -o "$resp" -w '%{http_code}' \
            --connect-timeout 10 --max-time 60 -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$base/api/v1/deploy?uuid=$COOLIFY_APP_UUID")" || curl_exit=$?
          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::deploy request failed (curl exit $curl_exit)"
            exit 1
          fi
          if [ "${code:0:1}" != "2" ]; then
            echo "::error::deploy request failed (status $code)"
            exit 1
          fi
          deployment="$(jq -r '.deployments[0].deployment_uuid // empty' "$resp" 2>/dev/null || true)"
          if [ -z "$deployment" ]; then
            echo "::error::Coolify accepted the request but returned no deployment id"
            exit 1
          fi
          echo "::add-mask::$deployment"
          echo "Coolify queued the deployment; polling its status"

          deadline=$(( $(date +%s) + DEPLOY_WAIT_SECONDS ))
          last=""
          while :; do
            curl_exit=0
            code="$(curl -s -o "$resp" -w '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$base/api/v1/deployments/$deployment")" || curl_exit=$?
            if [ "$curl_exit" -ne 0 ]; then
              state="transient: curl exit $curl_exit"
            elif [ "${code:0:1}" != "2" ]; then
              state="transient: status $code"
            else
              # Keep only status-shaped characters, so nothing else can reach the log.
              deploy_state="$(jq -r '.status // empty' "$resp" 2>/dev/null | tr -cd 'a-z_-' || true)"
              case "$deploy_state" in
                finished)
                  echo "Deployment finished"
                  exit 0
                  ;;
                failed|cancelled*)
                  echo "::error::Coolify deployment ended as '$deploy_state'; see its log in Coolify"
                  exit 1
                  ;;
                queued|in_progress)
                  state="$deploy_state"
                  ;;
                "")
                  state="transient: no status in response"
                  ;;
                *)
                  state="unrecognised status '$deploy_state'"
                  ;;
              esac
            fi
            if [ "$state" != "$last" ]; then
              echo "Deployment: $state"
              last="$state"
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Coolify deployment did not finish within ${DEPLOY_WAIT_SECONDS}s (last: $state)"
              exit 1
            fi
            sleep "$DEPLOY_POLL_SECONDS"
          done
