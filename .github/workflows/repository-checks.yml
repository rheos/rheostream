name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public repository boundaries and links
        run: python3 scripts/check_repository.py
      - name: Check for legacy product names (criterion 34)
        run: make legacy-names
      - name: Check fixture provenance and synthetic content (criterion 35)
        run: make fixture-provenance
      - name: Check for search inputs outside Recallatron's screen (AC 10)
        run: make search-boundary
      - name: Check every web workspace package declares lint/typecheck/test
        run: make workspace-scripts

  # The container image had no gate anywhere until this job (issue #49). The host
  # half of `make build` stalls on a credential helper reaching ghcr.io, which the
  # Dockerfile needs for the pinned uv binary, and F46 recorded that as unproven.
  # `deploy/compose.yaml` does build this same Dockerfile for the `core` service and
  # `make demo` drives it, so the image is exercised by hand — but by nothing
  # automatic. Runner images ship Docker and pull public ghcr.io anonymously, so the
  # helper that stalls locally is not in the way here. Plain `docker build` rather
  # than a build action keeps the workflow's SHA-pinning convention free of another
  # dependency; the build context is the checkout root, matching compose's
  # `context: ..` and the Dockerfile's repo-root-relative COPYs.
  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the core/worker image
        run: docker build -f Dockerfile .
      - name: Build the web image
        run: docker build -t rheo-web -f apps/web/Dockerfile .
      # A web image that builds is not yet one that serves: `next start` must
      # find the production build from the image's runtime directory. Start it
      # detached and poll for HTTP 200 (bounded at about 60 s), printing the
      # container's logs if it never answers.
      - name: The web image serves HTTP 200
        run: |
          docker run -d --name rheo-web-check -p 3000:3000 rheo-web
          ok=0
          for attempt in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)" = "200" ]; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "web image did not answer HTTP 200 within about 60 s" >&2
            docker logs rheo-web-check >&2 || true
          fi
          docker rm -f rheo-web-check >/dev/null
          [ "$ok" = "1" ]
      - name: Build the flagship core image (local-embeddings extra)
        run: docker build --build-arg UV_SYNC_ARGS="--extra local-embeddings" -t rheo-flagship-core -f Dockerfile .
      # AC-10: the flagship image installs the local embedding runtime and can
      # select it offline, no database and no network, through the same `uv
      # run` entry the `core` and `worker` services use. `register_module_settings()`
      # is #108's early hook; `configured_provider_name()` reads back the
      # deployment-scoped key it declares. Proves #108 end to end inside the
      # shipped flagship image.
      - name: Dense retrieval is selectable, offline, in the flagship image (AC-10)
        run: |
          # --no-sync tests the venv as built: plain `uv run` re-syncs and needs PyPI once uv's index cache ages (#152).
          docker run --rm --network none \
            -e RHEO__modules__installed=recallatron \
            -e RHEO__recallatron__embedding__provider=local \
            rheo-flagship-core uv run --no-sync python -c "
          from rheo_core.modules import register_module_settings
          from rheo_recallatron.embedding.local import LocalEmbeddingProvider
          from rheo_recallatron.embedding.registry import configured_provider_name, resolve_provider

          register_module_settings()
          provider = configured_provider_name()
          assert provider == 'local', f'expected local, got {provider!r}'
          resolved = resolve_provider()
          assert isinstance(resolved, LocalEmbeddingProvider), f'expected LocalEmbeddingProvider, got {resolved!r}'

          import fastembed  # noqa: F401 -- proves the extra's runtime is importable offline

          print(f'AC-10 OK: configured_provider_name() == {provider!r}; resolve_provider() is LocalEmbeddingProvider; fastembed imported')
          "

  python:
    name: Python checks
    runs-on: ubuntu-latest
    # A green run takes 11-12 min and grows with the suite (8 min on 2026-09-24).
    # The old 15-min cap cancelled two passing runs on PR #144 (#151). 30 leaves
    # headroom; the pytest step prints its slowest tests so creep shows early.
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rheo
          POSTGRES_PASSWORD: rheo_dev_only
          POSTGRES_DB: rheo
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rheo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Deliberately NOT RHEO_CLUSTER_DSN: tests/conftest.py derives it from
      # RHEO_TEST_CLUSTER_DSN so the suite reaches the cluster through the
      # production settings->secret-scope path, not an injected DSN.
      RHEO_TEST_CLUSTER_DSN: postgresql://rheo:rheo_dev_only@localhost:5432/postgres
      RHEO_PROFILE: test
      # Where tests/conftest.py keeps local model artifacts across sessions. The cache
      # step below restores it, so the real embedding model is not downloaded on every
      # run and a third party's availability does not decide whether CI is green.
      RHEO_TEST_MODEL_CACHE: /home/runner/.cache/rheo-stream/test-models
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.29"
      # With the extra: Recallatron's real-provider tests fail, never skip, when the
      # local embedding runtime is missing, and mypy type-checks against it.
      - name: Sync (frozen)
        run: uv sync --frozen --extra local-embeddings
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      # Keyed on the model identifier, so a model change misses the cache instead of
      # restoring the old artifact under the new name. The identifier is
      # rheo_recallatron/embedding/local.py's MODEL_ID; change the two together.
      - name: Restore the test model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RHEO_TEST_MODEL_CACHE }}
          key: test-models-sentence-transformers/all-MiniLM-L6-v2
      - name: Pytest
        run: uv run pytest --durations=20
      # Project criterion 31: Recallatron's behavioural suite under `lexical`, then
      # under `dense` against the real local model. The dense pass reads the artifact
      # the cache step above restores, so a cold runner that cannot fetch it reds a
      # project criterion here, not a convenience test.
      - name: Criterion 31 (lexical and dense passes)
        run: make criterion-31

  absence-proof:
    name: Recallatron absence proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rheo
          POSTGRES_PASSWORD: rheo_dev_only
          POSTGRES_DB: rheo
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rheo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Deliberately NOT RHEO_CLUSTER_DSN: tests/conftest.py derives it from
      # RHEO_TEST_CLUSTER_DSN so the suite reaches the cluster through the
      # production settings->secret-scope path, not an injected DSN.
      RHEO_TEST_CLUSTER_DSN: postgresql://rheo:rheo_dev_only@localhost:5432/postgres
      RHEO_PROFILE: test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.29"
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: Run make absence-proof
        run: make absence-proof

  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm before setup-node: setup-node's `cache: pnpm` needs pnpm on PATH.
      # The pnpm version comes from the `packageManager` field in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches the root package.json engines floor. Vite 7 needs
          # ^20.19.0 || >=22.12.0, and a bare `22` would permit 22.0-22.11.
          node-version: ">=22.12 <23"
          cache: pnpm
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      # uv is installed in THIS job, not only in `python`, because `make codegen`
      # needs both toolchains: `rheo openapi` builds the document and
      # `pnpm -C apps/web exec openapi-typescript` derives the TypeScript from it.
      # The same SHA-pinned action and the same version the `python` job uses —
      # this repository pins every action by SHA.
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.29"
      - name: Sync (frozen)
        run: uv sync --frozen
      # The generated artifacts are generated, not hand-maintained: regenerating
      # them from the operation registry must leave the tree clean. This is the
      # byte-exact gate — `tests/test_generated_artifacts.py` asserts only the
      # banners, because a byte-exactness assertion inside pytest would need Node
      # and pnpm and the `python` job has neither. That is also why this step is
      # here and not there, and why it is not a separate `codegen` job, which
      # would duplicate both installs for one command. The composed module list
      # (`rheo web compose`) is the third generated file and is diffed here too.
      - name: Generated API artifacts are reproducible
        run: make codegen && git diff --exit-code -- apps/web/src/generated apps/web/src/modules.generated.ts
      - name: ESLint
        run: pnpm -r lint
      - name: Type check
        run: pnpm -r typecheck
      - name: Build
        run: pnpm -C apps/web build
      - name: Vitest (path mode)
        run: pnpm -r test
        env:
          RHEO_ROUTING_MODE: path
      - name: Vitest (subdomain mode)
        run: pnpm -r test
        env:
          RHEO_ROUTING_MODE: subdomain
      # After `next build`, so .next/ exists — proves the scan skips generated output.
      - name: Web platform-only gate (criterion 23)
        run: python3 scripts/check_web_platform.py
      # Needs .next/ for the same reason as the platform gate above: the scan's
      # apps/web/src/** root is unaffected, but running after build keeps this
      # step beside its sibling gate rather than ahead of a fresher tree state.
      - name: Routing-literal gate (criterion 22)
        run: python3 scripts/check_routing_literals.py
      # Placed beside the two gates above for grouping only. Its roots are
      # apps/web/src and modules/*/web, and apps/web/.next sits outside them, so
      # running after the build proves nothing about skipping .next/; the self-test
      # covers its exact-path exemptions instead.
      - name: Theme-token gate (AC 4)
        run: make theme-tokens
