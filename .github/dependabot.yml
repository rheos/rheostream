# Weekly dependency updates, grouped so a routine week is one PR per ecosystem
# rather than one per package. Major bumps stay ungrouped on purpose: those are
# the ones that deserve to be read individually.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    ignore:
      # ESLint 10 is still blocked, but no longer for the reason PR #28 hit.
      # That was eslint-config-next 15's @rushstack/eslint-patch; since the
      # Next 16 upgrade (#53) the blocker is eslint-plugin-react 7.37.5, a
      # transitive of eslint-config-next 16, whose declared peer range is
      # "^3 || ^4 || ^5 || ^6 || ^7 || ^8 || ^9.7" and which crashes in
      # testReactVersion under 10. Retest when that plugin ships ESLint 10
      # support. Minor and patch still flow.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the Go port, and it does not expose the JS compiler
      # API that `openapi-typescript` builds on. openapi-typescript 7.13.0 (the
      # latest) reads `ts.factory.createKeywordTypeNode` at module load and
      # dies with "Cannot read properties of undefined" before it parses
      # anything, which takes out `make codegen` — the first step of Web checks
      # (PR #58). Its declared peer is still `typescript: "^5.x"`, so there is
      # no TS 6 support to step through either. Retest when openapi-typescript
      # ships a release that peers TypeScript 7. Minor and patch still flow.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # vite and vitest have to move as a unit: vitest majors import Vite
      # subpaths that older Vite does not export, so bumped apart they produce
      # a pair that cannot resolve (PR #29). Listed first, and excluded from
      # the catch-all below, so neither group can claim them by accident.
      vite-toolchain:
        patterns: ["vite", "vitest", "@vitest/*"]
      javascript-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["vite", "vitest", "@vitest/*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
