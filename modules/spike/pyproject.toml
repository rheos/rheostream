[project]
name = "rheo-spike"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# The throwaway vertical-slice module of run 0v. It reaches the core registries
# through the ``rheo.modules`` entry point below and nothing else; `rheo-core`
# would carry `rheo-contracts` transitively, but the manifest and the operation
# declarations import `rheo_contracts` by name, so it is declared directly.
dependencies = ["rheo-core", "rheo-contracts"]

[project.scripts]
rheo-spike = "rheo_spike.devtools:main"

# The entry-point **name is the module id**: the loader matches ``RHEO_MODULES``
# against this name before it imports anything, and then refuses a manifest whose
# ``module_id`` disagrees with it.
[project.entry-points."rheo.modules"]
spike = "rheo_spike.manifest:MANIFEST"

[tool.uv.sources]
rheo-core = { workspace = true }
rheo-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rheo_spike"]
