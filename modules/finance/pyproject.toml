[project]
name = "rheo-finance"
version = "0.1.0"
description = "Finance: a personal ledger and reminder module for rheoStream."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# The four parsing modules once taken from a git dependency are vendored under
# `rheo_finance.parsers.vendored` (see that package's docstring), so nothing here
# resolves from outside the workspace's index. The bounds match `rheo-core`'s, so one
# version of each resolves for both.
dependencies = [
    "rheo-core",
    "rheo-contracts",
    "sqlalchemy>=2.1,<2.2",
    "psycopg[binary]>=3.3.6,<4",
    "alembic>=1.20.0,<2",
    "pydantic>=2,<3",
]

# Discovery is not loading: core loads only the ids in `modules.installed`.
[project.entry-points."rheo.modules"]
finance = "rheo_finance:MANIFEST"

[project.scripts]
finance = "rheo_finance.cli.main:main"

[tool.uv.sources]
rheo-core = { workspace = true }
rheo-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rheo_finance"]

# The suite is the package `tests` here (`tests.derive.support`, ...), so the import
# sorter must know it as first-party, as it knows `rheo_finance`. Everything else
# comes from the root configuration.
[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "."]
