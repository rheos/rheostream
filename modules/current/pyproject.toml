[project]
name = "rheo-current"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# pydantic 2.12 added Field(exclude_if=...), which ItemCreated relies on.
dependencies = ["rheo-core", "rheo-contracts", "pydantic>=2.14.1,<3"]

[project.entry-points."rheo.modules"]
current = "rheo_current:MANIFEST"

[tool.uv.sources]
rheo-core = { workspace = true }
rheo-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rheo_current"]
