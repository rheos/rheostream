[project]
name = "rheo-relationships"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["rheo-core", "rheo-contracts"]

[project.entry-points."rheo.modules"]
relationships = "rheo_relationships:MANIFEST"

[tool.uv.sources]
rheo-core = { workspace = true }
rheo-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rheo_relationships"]
