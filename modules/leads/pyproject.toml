[project]
name = "rheo-leads"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["rheo-core", "rheo-contracts", "psycopg[binary]>=3.3.6,<4"]

[tool.uv.sources]
rheo-core = { workspace = true }
rheo-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rheo_leads"]
