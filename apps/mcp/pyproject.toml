[project]
name = "rheo-app-mcp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# rheo-core lands as a dependency in 0b2 (C8), not 0c: the facade's session
# resolver (context_from_token, over rheo_core.boundary) and its two
# registered tools (over rheo_core.operations and rheo_core.tokens) both need
# it. tests/test_mcp_boundary.py's AST scan keeps this narrower than a plain
# dependency listing would suggest -- it allows only rheo_core.boundary,
# rheo_core.operations and rheo_core.tokens (plus rheo_contracts), still
# denying rheo_core.storage, rheo_core.migrations and any DB driver, so
# criterion 20 stays meaningful rather than vacuous.
# The ``mcp`` SDK is this distribution's own dependency and no other's: it is the
# wire protocol the streamable-HTTP transport in ``transport.py`` speaks, and
# nothing in ``packages/core`` or the other apps imports it. Declared here rather
# than in the root's dev group so a deployment that installs only this app gets a
# working façade.
dependencies = ["rheo-contracts", "rheo-core", "mcp>=1.2"]

[tool.uv.sources]
rheo-contracts = { workspace = true }
rheo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rheo_app_mcp"]
