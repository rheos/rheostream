[project]
name = "rheo-app-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rheo-core",
    "rheo-contracts",
    "rheo-app-mcp",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv.sources]
# All three are local workspace members, not published to any index.
rheo-core = { workspace = true }
rheo-contracts = { workspace = true }
rheo-app-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rheo_app_core"]
