[project]
name = "rheo-app-bridge"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# The laptop bridge for an enrolled local Claude Code directory. It runs in a
# rheo-stream checkout's own venv and reuses the core sanitizer through
# rheo-core (the dependency route, not a split). Its hook script, hook.py,
# imports nothing but the standard library and is copied out of the package.
dependencies = ["rheo-core"]

[project.scripts]
rheo-bridge = "rheo_bridge.cli:main"

[tool.uv.sources]
rheo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rheo_bridge"]
