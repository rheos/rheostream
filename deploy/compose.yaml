# Local dev stack, extended in run 0b1: a Postgres with pgvector + pg_trgm
# available, and the `core` image, which now makes a real database call at
# startup (rheo_app_core.startup.run_startup, from the FastAPI lifespan) — the
# control-chain migration and per-workspace migrations. No `web` service — 0a
# runs the web shell under `next start` outside compose (spec.md W1); `make demo`
# orchestrates that. Credentials here are dev-only, non-secret placeholders —
# this is a local compose file, not a secret-store entry (that seam is 0b / A4).
name: rheo-stream

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rheo
      POSTGRES_PASSWORD: rheo_dev_only
      POSTGRES_DB: rheo
    # Host port is parameterised so a developer whose 5432 is already bound by an
    # unrelated project can run this stack without touching that container. The
    # default is the literal previous value, so a fresh clone is unchanged.
    ports:
      - "${RHEO_PG_PORT:-5432}:5432"
    # Data on a named Docker volume, never a bind mount into the repo, so
    # `make up`/`make demo` write nothing into the tracked tree (criterion 2).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rheo -d rheo"]
      interval: 5s
      timeout: 5s
      retries: 10

  core:
    # `compose.yaml` lives in deploy/, so the build context is the parent
    # directory — the checkout root — where the Dockerfile and root manifests
    # live (spec.md Technical Risks, risk 4).
    build:
      context: ..
      dockerfile: Dockerfile
    # Named explicitly (compose's own default tag for this service under
    # `make up`'s project) so `worker` below can share it: two services with
    # identical `build:` blocks but no shared `image:` tag are two
    # byte-identical images, not one, and `docker compose build` would build
    # and tag both rather than build once and reuse it. Either service can
    # still be built standalone; only the tag is shared. This does change
    # `core`'s behavior under `make demo` specifically: that target runs its
    # own compose project (`-p rheo-stream-demo`), where compose's unpinned
    # default for `core` would have been `rheo-stream-demo-core` — pinning
    # this tag means `make up` and `make demo` now share one image tag for
    # `core`, where before this they built to two distinct, never-shared
    # tags. Low severity, since neither target passes `--build`, but real: a
    # `make up`-built image under this tag can now be silently served by a
    # later `make demo` run, or vice versa, without either target rebuilding
    # it.
    image: rheo-stream-core
    # Host port is parameterised for the same reason as postgres's: an unrelated
    # process on this machine may already hold 8000. The container always
    # listens on 8000 internally; only the host-side publish moves.
    ports:
      - "${RHEO_CORE_PORT:-8000}:8000"
    # `core` now makes a real database call in its lifespan (the control-chain
    # migration), so it must wait for postgres to be accepting connections, not
    # merely for the container to have started.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Compose-network DSN: `postgres` is the service's DNS name on the compose
      # network, always port 5432 there regardless of the host-side RHEO_PG_PORT
      # remap (that remap is host-port-only; nothing on the compose network reads
      # RHEO_PG_PORT).
      RHEO_CLUSTER_DSN: postgresql://rheo:rheo_dev_only@postgres:5432/postgres
      RHEO_DATA_ROOT: /var/lib/rheo-stream
      RHEO_IN_CONTAINER: "1"
      RHEO_PROFILE: development
      # The internal listener's shared secret (C10). Both `internal.secret_ref`
      # and `identity.providers.github.client_secret_ref` ship an EMPTY-STRING
      # package default (07's D4/D5 fix) precisely so a fresh clone's `make
      # test`/CI stays green before this step exists; this is the deployment
      # half of that fix, wiring the real `secret://env/...` reference the same
      # way POSTGRES_PASSWORD above is a dev-only, non-secret placeholder.
      RHEO_INTERNAL_SECRET: rheo_dev_only_internal_secret
      RHEO__internal__secret_ref: secret://env/RHEO_INTERNAL_SECRET
      # The GitHub OAuth app's client secret reference — wired so the setting is
      # not inert, even though `identity.providers.github.enabled`/`client_id`
      # stay at their package defaults (false/empty) here: the demo topology
      # does not need a working GitHub app, only the reference resolved.
      RHEO_GITHUB_CLIENT_SECRET: ""
      RHEO__identity__providers__github__client_secret_ref: secret://env/RHEO_GITHUB_CLIENT_SECRET
      # The routing topology for the local demo: single-host path mode, over
      # plain http, matching `make demo`'s own web port (`RHEO_WEB_PORT`
      # default 3000) — see Makefile's `demo` recipe and `deploy/README.md`.
      RHEO__routing__mode: path
      RHEO__routing__scheme: http
      RHEO__routing__base_host: "localhost:3000"
    volumes:
      # Named volume, never a bind mount into the repo, so `make up`/`make demo`
      # write nothing into the tracked tree (criterion 2) — same rule as pgdata.
      - rheodata:/var/lib/rheo-stream

  worker:
    # Same image as `core`, no separate build — see the `image:` note on
    # `core` above. The `build:` block is repeated here (not just the tag) so
    # `worker` can still be built standalone.
    build:
      context: ..
      dockerfile: Dockerfile
    image: rheo-stream-core
    # `apps/worker/src/rheo_app_worker/main.py` (02), run as a module so it
    # picks up the same interpreter and dependency set the image already has
    # — no rebuild, only the command differs from `core`'s image default.
    command: ["uv", "run", "python", "-m", "rheo_app_worker.main"]
    # A worker publishes nothing to the host or the compose network — no
    # `ports:`, and the image's own `EXPOSE` is for `core`'s listeners, not
    # this service.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # `core`'s environment, minus the keys a worker never reads: routing and
      # identity configuration only matters to something serving HTTP, and
      # this service serves nothing. Same four keys, same values as `core`.
      RHEO_CLUSTER_DSN: postgresql://rheo:rheo_dev_only@postgres:5432/postgres
      RHEO_DATA_ROOT: /var/lib/rheo-stream
      RHEO_IN_CONTAINER: "1"
      RHEO_PROFILE: development
    volumes:
      # Same named volume, same mount point, same reason as `core` — never a
      # bind mount into the repo.
      - rheodata:/var/lib/rheo-stream

volumes:
  pgdata:
  rheodata:
